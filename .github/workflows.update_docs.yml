name: Update Data Layer Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'schemas.yaml' # Only run when the main YAML changes
      - 'scripts/generate_docs.py' # Or if you update the generator logic

permissions:
  contents: write # Required to push the new MD files back to the repo

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run Generator Script
        run: |
          python scripts/generate_docs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/*.md
          # Only commit if there are changes to avoid empty commit errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated documentation from schemas.yaml" && git push)
